<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="title">ژنراتور Lorem Ipsum فارسی</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<script>
(function(){try{var t=(localStorage.getItem('theme')||'').replace(/"/g,'');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<link rel="stylesheet" href="../Vazirmatn-font-face.css">
<link rel="stylesheet" href="../assets/tools.css">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="../assets/tool-wrapper.css">
</head>
<body>
<main class="page lg">
  <header class="lg-head">
    <p class="lg-eyebrow" data-i18n="text_eyebrow_0">متن تستی فوری</p>
    <h1 data-i18n="heading_0">ژنراتور Lorem Ipsum فارسی</h1>
    <p class="lg-muted" data-i18n="text_lead_1">چند خط یا پاراگراف از متن تولیدشده برای چیدمان رابط کاربری، بدون نیاز به سرور یا تنظیمات پیچیده.</p>
  </header>

  <section class="lg-card" aria-label="تنظیمات تولید" data-i18n-aria="aria_controls">
    <div class="lg-field">
      <span class="lg-label" id="unitLabel" data-i18n="unit_label">واحد</span>
      <div class="lg-seg" role="radiogroup" aria-labelledby="unitLabel">
        <button type="button" role="radio" class="lg-seg-btn is-active" aria-checked="true" data-unit="paragraphs" data-i18n="unit_paragraphs">پاراگراف</button>
        <button type="button" role="radio" class="lg-seg-btn" aria-checked="false" data-unit="sentences" data-i18n="unit_sentences">جمله</button>
        <button type="button" role="radio" class="lg-seg-btn" aria-checked="false" data-unit="words" data-i18n="unit_words">کلمه</button>
      </div>
    </div>
    <div class="lg-field">
      <label for="countInput" id="countLabel" data-i18n="count_paragraphs">تعداد پاراگراف</label>
      <div class="lg-count">
        <button type="button" class="lg-btn lg-btn--icon" id="minusBtn" data-i18n-aria="decrease" aria-label="کمتر">−</button>
        <input id="countInput" class="lg-input" type="text" inputmode="numeric" maxlength="3" value="3" dir="ltr">
        <button type="button" class="lg-btn lg-btn--icon" id="plusBtn" data-i18n-aria="increase" aria-label="بیشتر">+</button>
      </div>
    </div>
    <div class="lg-field" id="perParaField">
      <label for="perPara" data-i18n="per_para">جملات در هر پاراگراف</label>
      <div class="lg-range">
        <input id="perPara" type="range" min="2" max="8" value="4">
        <output id="perParaValue" for="perPara">۴</output>
      </div>
    </div>
    <div class="lg-actions">
      <button type="button" class="lg-btn lg-btn--primary" id="generateBtn" data-i18n="button_0">تولید جدید</button>
      <button type="button" class="lg-btn" id="copyBtn" data-i18n="button_1" disabled>کپی متن</button>
    </div>
  </section>

  <section class="lg-card" aria-labelledby="outTitle">
    <div class="lg-row">
      <h2 id="outTitle" data-i18n="heading_1">متن تولیدشده</h2>
      <p class="lg-stats" id="stats"></p>
    </div>
    <div class="lg-result" id="result" tabindex="0" lang="fa"></div>
    <p class="lg-status" id="status" role="status" aria-live="polite"></p>
  </section>
</main>
<script src="assets/js/app.js"></script>
<script src="../assets/tool-wrapper.js"></script>
</body>
</html>
