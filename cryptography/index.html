<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title data-i18n="title">رمزنگاری و ارسال متن</title>
<link href="/favicon.ico" rel="icon" type="image/x-icon"/>
<link href="../Vazirmatn-font-face.css" rel="stylesheet"/>
<link href="assets/css/style.css" rel="stylesheet"/>
<link href="../assets/tool-wrapper.css" rel="stylesheet"/>
</head>
<body>
<div class="container">
  <header>
    <h1 data-i18n="appName">🔐 رمزنگاری متن امن</h1>
    <p class="subtitle" data-i18n="subtitle">ارسال پیام‌های محرمانه با AES-256-GCM</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab-button active" id="tab-encrypt" role="tab" aria-selected="true" aria-controls="encrypt-tab" data-tab="encrypt" type="button"><span aria-hidden="true">🔒</span> <span data-i18n="tabEncrypt">رمزنگاری</span></button>
    <button class="tab-button" id="tab-decrypt" role="tab" aria-selected="false" aria-controls="decrypt-tab" data-tab="decrypt" tabindex="-1" type="button"><span aria-hidden="true">🔓</span> <span data-i18n="tabDecrypt">رمزگشایی</span></button>
    <button class="tab-button" id="tab-history" role="tab" aria-selected="false" aria-controls="history-tab" data-tab="history" tabindex="-1" type="button"><span aria-hidden="true">📜</span> <span data-i18n="tabHistory">تاریخچه</span></button>
  </div>

  <section class="tab-content" id="encrypt-tab" role="tabpanel" aria-labelledby="tab-encrypt">
    <div class="card">
      <h2 data-i18n="encryptTitle">رمزنگاری متن</h2>
      <form id="encrypt-form" autocomplete="off">
        <div class="form-group">
          <label for="plain-text" data-i18n="plainText">متن اصلی</label>
          <textarea id="plain-text" rows="6" required data-i18n-ph="plainPh"></textarea>
        </div>
        <div class="form-group">
          <label for="encrypt-key" data-i18n="privateKey">کلید خصوصی</label>
          <div class="key-input-wrapper">
            <input id="encrypt-key" type="password" autocomplete="new-password" required data-i18n-ph="keyPh"/>
            <button class="toggle-password" type="button" data-target="encrypt-key" aria-pressed="false" data-i18n-aria="showKey">👁️</button>
          </div>
          <small class="help-text" data-i18n="keyHelp"></small>
        </div>
        <fieldset class="form-group">
          <legend data-i18n="charsetLabel">نوع کاراکترهای خروجی</legend>
          <div class="checkbox-group">
            <label class="checkbox-label"><input checked name="charset" type="checkbox" value="persian"/><span data-i18n="csPersian">فارسی</span></label>
            <label class="checkbox-label"><input name="charset" type="checkbox" value="english"/><span data-i18n="csEnglish">English</span></label>
            <label class="checkbox-label"><input name="charset" type="checkbox" value="numbers"/><span data-i18n="csNumbers">اعداد</span></label>
            <label class="checkbox-label"><input name="charset" type="checkbox" value="symbols"/><span data-i18n="csSymbols">علائم</span></label>
          </div>
          <small class="help-text" data-i18n="charsetNote"></small>
        </fieldset>
        <button class="btn btn-primary" id="encrypt-btn" type="submit"><span aria-hidden="true">🔒</span> <span data-i18n="encryptBtn">رمزنگاری متن</span></button>
      </form>
      <div class="result-box" id="encrypt-result" hidden>
        <label data-i18n="encryptedLabel">متن رمزنگاری‌شده</label>
        <div class="output-text" id="encrypted-text" dir="auto" tabindex="0"></div>
        <div class="button-group">
          <button class="btn btn-secondary" id="copy-encrypted" type="button"><span aria-hidden="true">📋</span> <span data-i18n="copy">کپی</span></button>
          <button class="btn btn-secondary" id="save-encrypted" type="button"><span aria-hidden="true">💾</span> <span data-i18n="saveHistory">ذخیره در تاریخچه</span></button>
        </div>
        <small class="help-text" data-i18n="historyNote"></small>
      </div>
    </div>
  </section>

  <section class="tab-content" id="decrypt-tab" role="tabpanel" aria-labelledby="tab-decrypt" hidden>
    <div class="card">
      <h2 data-i18n="decryptTitle">رمزگشایی متن</h2>
      <form id="decrypt-form" autocomplete="off">
        <div class="form-group">
          <label for="cipher-text" data-i18n="cipherText">متن رمزنگاری‌شده</label>
          <textarea id="cipher-text" rows="6" required dir="auto" data-i18n-ph="cipherPh"></textarea>
        </div>
        <div class="form-group">
          <label for="decrypt-key" data-i18n="privateKey">کلید خصوصی</label>
          <div class="key-input-wrapper">
            <input id="decrypt-key" type="password" autocomplete="current-password" required data-i18n-ph="keyPh"/>
            <button class="toggle-password" type="button" data-target="decrypt-key" aria-pressed="false" data-i18n-aria="showKey">👁️</button>
          </div>
        </div>
        <button class="btn btn-primary" id="decrypt-btn" type="submit"><span aria-hidden="true">🔓</span> <span data-i18n="decryptBtn">رمزگشایی متن</span></button>
      </form>
      <div class="result-box" id="decrypt-result" hidden>
        <label data-i18n="decryptedLabel">متن اصلی</label>
        <div class="output-text" id="decrypted-text" dir="auto" tabindex="0"></div>
        <div class="button-group">
          <button class="btn btn-secondary" id="copy-decrypted" type="button"><span aria-hidden="true">📋</span> <span data-i18n="copy">کپی</span></button>
          <button class="btn btn-secondary" id="hide-decrypted" type="button"><span aria-hidden="true">🙈</span> <span data-i18n="hideResult">پنهان‌کردن نتیجه</span></button>
        </div>
      </div>
      <div class="error-box" id="decrypt-error" role="alert" hidden><span aria-hidden="true">❌</span> <span id="decrypt-error-text"></span></div>
    </div>
  </section>

  <section class="tab-content" id="history-tab" role="tabpanel" aria-labelledby="tab-history" hidden>
    <div class="card">
      <div class="history-header">
        <h2 data-i18n="historyTitle">تاریخچه رمزنگاری</h2>
        <button class="btn btn-danger" id="clear-history" type="button"><span aria-hidden="true">🗑️</span> <span data-i18n="clearAll">پاک کردن همه</span></button>
      </div>
      <p class="help-text" data-i18n="historyNote"></p>
      <div class="history-list" id="history-list"></div>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <h3 id="confirm-title" data-i18n="confirmTitle">تایید</h3>
  <p id="confirm-message"></p>
  <div class="button-group">
    <button class="btn btn-danger" id="confirm-yes" type="button" data-i18n="yes">بله</button>
    <button class="btn btn-secondary" id="confirm-no" type="button" data-i18n="no">خیر</button>
  </div>
</dialog>

<script src="assets/js/crypto.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/app.js"></script>
<script src="../assets/tool-wrapper.js"></script>
</body>
</html>
