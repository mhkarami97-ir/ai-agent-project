<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="title">مترونوم و تمرین موسیقی</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<script>
(function(){try{var t=(localStorage.getItem('theme')||'').replace(/"/g,'');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<link rel="stylesheet" href="../Vazirmatn-font-face.css">
<link rel="stylesheet" href="../assets/tools.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="../assets/tool-wrapper.css">
</head>
<body>
<main class="page mt">
  <header class="mt-head">
    <h1 data-i18n="heading_0">مترونوم و تمرین موسیقی</h1>
  </header>

  <section class="mt-card mt-metro" aria-labelledby="metroTitle">
    <h2 id="metroTitle" class="mt-sr" data-i18n="metro_title">مترونوم</h2>
    <div class="mt-bpm">
      <input id="bpmInput" class="mt-bpm-input" type="text" inputmode="numeric" maxlength="3" dir="ltr" value="120" data-i18n-aria="aria_bpm" aria-label="BPM">
      <span class="mt-bpm-label">BPM</span>
    </div>
    <div class="mt-stepper">
      <button type="button" class="mt-step" id="bpmMinus" data-i18n-aria="bpm_down" aria-label="کمتر">−</button>
      <input id="bpmSlider" type="range" min="40" max="240" step="1" value="120" data-i18n-aria="aria_bpm_slider" aria-label="تنظیم سرعت BPM">
      <button type="button" class="mt-step" id="bpmPlus" data-i18n-aria="bpm_up" aria-label="بیشتر">+</button>
    </div>
    <div class="mt-quick" role="group" aria-label="سرعت‌های سریع" data-i18n-aria="aria_quick">
      <button type="button" class="mt-chip" data-bpm="60">60</button>
      <button type="button" class="mt-chip" data-bpm="80">80</button>
      <button type="button" class="mt-chip" data-bpm="100">100</button>
      <button type="button" class="mt-chip" data-bpm="120">120</button>
      <button type="button" class="mt-chip" data-bpm="140">140</button>
      <button type="button" class="mt-chip" data-bpm="160">160</button>
      <button type="button" class="mt-chip mt-chip--tap" id="tapBtn" data-i18n="tap">ضرب‌گیری</button>
    </div>

    <div class="mt-field">
      <span class="mt-label" id="sigLabel" data-i18n="label_0">تعداد ضربات در هر میزان:</span>
      <div class="mt-sigs" role="radiogroup" aria-labelledby="sigLabel" id="sigs">
        <button type="button" role="radio" class="mt-chip" aria-checked="false" data-sig="2/4">2/4</button>
        <button type="button" role="radio" class="mt-chip" aria-checked="false" data-sig="3/4">3/4</button>
        <button type="button" role="radio" class="mt-chip is-active" aria-checked="true" data-sig="4/4">4/4</button>
        <button type="button" role="radio" class="mt-chip" aria-checked="false" data-sig="5/4">5/4</button>
        <button type="button" role="radio" class="mt-chip" aria-checked="false" data-sig="6/8">6/8</button>
      </div>
    </div>

    <div class="mt-row2">
      <label class="mt-check"><input type="checkbox" id="accentFirst" checked><span data-i18n="label_1">تأکید روی ضربه اول</span></label>
      <div class="mt-vol">
        <label for="volume" data-i18n="volume">صدا</label>
        <input id="volume" type="range" min="0" max="100" step="5" value="70">
      </div>
    </div>

    <div class="mt-dots" id="dots" aria-hidden="true"></div>
    <button type="button" class="mt-play" id="playBtn" aria-pressed="false">
      <span class="mt-play-icon" id="playIcon" aria-hidden="true">▶</span>
      <span id="playText" data-i18n="text_play_text_1">شروع</span>
    </button>
    <p class="mt-hint" data-i18n="kbd_hint">میانبرها: فاصله = شروع/توقف، ↑ و ↓ = تغییر سرعت</p>
  </section>

  <section class="mt-card mt-timer" aria-labelledby="timerTitle">
    <h2 id="timerTitle" data-i18n="heading_1">تایمر تمرین</h2>
    <div class="mt-time" id="timeDisplay" role="timer" aria-live="off">10:00</div>
    <div class="mt-quick" id="presets" role="group" aria-label="مدت تمرین" data-i18n-aria="aria_presets">
      <button type="button" class="mt-chip" data-min="5">5</button>
      <button type="button" class="mt-chip" data-min="10">10</button>
      <button type="button" class="mt-chip" data-min="15">15</button>
      <button type="button" class="mt-chip" data-min="20">20</button>
      <button type="button" class="mt-chip" data-min="30">30</button>
      <span class="mt-unit" data-i18n="minutes_short">دقیقه</span>
    </div>
    <div class="mt-custom">
      <label for="customMin" class="mt-sr" data-i18n="aria_custom">دقیقه تمرین</label>
      <input id="customMin" class="mt-input" type="text" inputmode="numeric" maxlength="3" dir="ltr" data-i18n-placeholder="ph_minutes" placeholder="دقیقه">
      <button type="button" class="mt-btn" id="setCustom" data-i18n="button_19">تنظیم</button>
    </div>
    <div class="mt-actions">
      <button type="button" class="mt-btn mt-btn--primary" id="startTimer" data-i18n="button_20">شروع تایمر</button>
      <button type="button" class="mt-btn" id="pauseTimer" data-i18n="button_21" disabled>توقف</button>
      <button type="button" class="mt-btn" id="resetTimer" data-i18n="button_22">ریست</button>
    </div>
    <div class="mt-field">
      <label for="note" class="mt-sr" data-i18n="aria_note">یادداشت جلسه تمرین</label>
      <input id="note" class="mt-input" type="text" maxlength="200" data-i18n-placeholder="ph_note" placeholder="یادداشت تمرین (اختیاری)">
    </div>
    <p class="mt-hint" id="timerMsg" role="status" aria-live="polite"></p>
  </section>

  <section class="mt-card" aria-labelledby="histTitle">
    <div class="mt-row">
      <h2 id="histTitle" data-i18n="heading_2">تاریخچه تمرین</h2>
      <button type="button" class="mt-btn mt-btn--danger mt-btn--sm" id="clearHist" data-i18n="button_23" hidden>پاک کردن تاریخچه</button>
    </div>
    <div class="mt-stats">
      <div class="mt-stat"><strong id="stToday">0</strong><span data-i18n="st_today">کل زمان تمرین امروز</span></div>
      <div class="mt-stat"><strong id="stTotal">0</strong><span data-i18n="st_total">کل زمان تمرین</span></div>
      <div class="mt-stat"><strong id="stCount">0</strong><span data-i18n="st_count">تعداد جلسات</span></div>
    </div>
    <div id="histList" class="mt-hist" aria-live="polite"></div>
  </section>
</main>

<dialog id="confirmDialog" class="mt-dialog" aria-labelledby="confirmText">
  <form method="dialog">
    <p id="confirmText"></p>
    <div class="mt-dialog-actions">
      <button type="submit" value="ok" class="mt-btn mt-btn--danger" data-i18n="confirm_yes">بله</button>
      <button type="submit" value="cancel" class="mt-btn" data-i18n="cancel">انصراف</button>
    </div>
  </form>
</dialog>
<div class="mt-toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="assets/script.js"></script>
<script src="../assets/tool-wrapper.js"></script>
</body>
</html>
