<!DOCTYPE html>

<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="تابلوی اعلانات محلی - اشتراک اطلاعات با همسایگان" name="description"/>
<title data-i18n="title">تابلوی اعلانات محلی</title>
<link href="../Vazirmatn-font-face.css" rel="stylesheet"/>
<link href="/favicon.ico" rel="icon" type="image/x-icon"/>
<link href="assets/css/style.css" rel="stylesheet"/>
<link href="../assets/tool-wrapper.css" rel="stylesheet"/>
</head>
<body>
<div class="container">
<!-- Header -->
<header class="header">
<div class="header-content">
<h1 class="logo" data-i18n="heading_0">
<span class="icon">📋</span>
                    تابلوی اعلانات محلی
                </h1>
<p class="subtitle" data-i18n="text_subtitle_1">اشتراک اطلاعات با همسایگان در محدوده نزدیک</p>
</div>
<button class="btn-notification" data-i18n="button_0" id="enableNotifications">
<span class="icon">🔔</span>
                فعال‌سازی اعلان‌ها
            </button>
</header>
<!-- Add Message Form -->
<section class="add-message-section">
<h2 class="section-title" data-i18n="heading_1">پیام جدید</h2>
<form class="message-form" id="messageForm">
<div class="form-group">
<label data-i18n="label_0" for="messageTitle">عنوان پیام</label>
<input class="form-input" id="messageTitle" placeholder="عنوان پیام خود را وارد کنید" required="" type="text"/>
</div>
<div class="form-group">
<label data-i18n="label_1" for="messageContent">متن پیام</label>
<textarea class="form-textarea" id="messageContent" placeholder="متن پیام خود را بنویسید..." required="" rows="4"></textarea>
</div>
<div class="form-row">
<div class="form-group">
<label data-i18n="label_2" for="messageCategory">دسته‌بندی</label>
<select class="form-select" id="messageCategory">
<option value="عمومی">عمومی</option>
<option value="اخبار">اخبار</option>
<option value="خرید و فروش">خرید و فروش</option>
<option value="خدمات">خدمات</option>
<option value="رویداد">رویداد</option>
<option value="اضطراری">اضطراری</option>
</select>
</div>
<div class="form-group">
<label data-i18n="label_3" for="senderName">نام فرستنده</label>
<input class="form-input" id="senderName" placeholder="نام شما (اختیاری)" type="text"/>
</div>
</div>
<button class="btn-submit" data-i18n="button_1" type="submit">
<span class="icon">✉️</span>
                    ارسال پیام
                </button>
</form>
</section>
<!-- Filter Section -->
<section class="filter-section">
<div class="filter-container">
<button class="filter-btn active" data-filter="همه" data-i18n="button_2">همه پیام‌ها</button>
<button class="filter-btn" data-filter="عمومی" data-i18n="button_3">عمومی</button>
<button class="filter-btn" data-filter="اخبار" data-i18n="button_4">اخبار</button>
<button class="filter-btn" data-filter="خرید و فروش" data-i18n="button_5">خرید و فروش</button>
<button class="filter-btn" data-filter="خدمات" data-i18n="button_6">خدمات</button>
<button class="filter-btn" data-filter="رویداد" data-i18n="button_7">رویداد</button>
<button class="filter-btn" data-filter="اضطراری" data-i18n="button_8">اضطراری</button>
</div>
<button class="btn-clear" data-i18n="button_9" id="clearMessages">
<span class="icon">🗑️</span>
                پاک کردن همه
            </button>
</section>
<!-- Messages List -->
<section class="messages-section">
<h2 class="section-title" data-i18n="heading_2">پیام‌های محلی</h2>
<div class="messages-list" id="messagesList">
<!-- Messages will be dynamically added here -->
</div>
<div class="empty-state" id="emptyState">
<span class="empty-icon">📭</span>
<p>هنوز پیامی ثبت نشده است</p>
<p class="empty-subtitle" data-i18n="text_empty_subtitle_6">اولین پیام را شما ارسال کنید!</p>
</div>
</section>
</div>
<!-- Toast Notification -->
<div class="toast" id="toast"></div>
<!-- Room Code Modal -->
<div class="modal" id="roomModal">
<div class="modal-content">
<span class="modal-close" id="closeModal">×</span>
<h2 class="modal-title" data-i18n="heading_3" id="modalTitle">کد اتاق</h2>
<div class="modal-body">
<div class="room-code-display" id="roomCodeDisplay">
<div class="room-code" id="roomCode">در حال ایجاد...</div>
<button class="btn-copy" data-i18n="button_10" id="copyRoomCode">
<span class="icon">📋</span>
                        کپی کد
                    </button>
</div>
<div class="join-room-input" id="joinRoomInput" style="display: none;">
<input class="form-input" id="roomCodeInput" maxlength="6" placeholder="کد اتاق را وارد کنید" type="text"/>
<button class="btn-submit" data-i18n="button_11" id="joinRoomBtn">
<span class="icon">🚪</span>
                        اتصال
                    </button>
</div>
</div>
<div class="modal-info">
<p>این کد را با همسایگان خود به اشتراک بگذارید تا به اتاق شما متصل شوند</p>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="../assets/tool-wrapper.js"></script>
</body>
</html>
