<!doctype html>
<html dir="rtl" lang="fa">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title data-i18n="title">تحلیلگر لاگ</title>
    <link rel="icon" href="/favicon.ico">
    <script>(function () { try { var t = (localStorage.getItem('theme') || '').replace(/"/g, ''); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t } catch (e) { } })()</script>
    <link rel="stylesheet" href="../Vazirmatn-font-face.css">
    <link rel="stylesheet" href="../assets/tools.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="../assets/tool-wrapper.css">
</head>

<body>
    <main class="la page">
        <header>
            <h1 data-i18n="heading_0">تحلیلگر لاگ</h1>
            <p class="muted" data-i18n="subtitle">فایل‌های لاگ را روی دستگاه خود بارگذاری، فیلتر و تحلیل کنید.</p>
        </header>
        <section class="la-card"><input id="file" type="file" accept=".txt,.log,.json,text/plain,application/json"
                hidden><label id="drop" for="file" class="drop"><b data-i18n="drop">فایل لاگ خود را اینجا بکشید یا لمس
                    کنید</b><span class="muted" data-i18n="hint">TXT، LOG و JSON تا ۱۰ مگابایت</span></label>
            <p id="fileInfo"></p>
        </section>
        <section id="work" hidden>
            <section class="la-card">
                <div class="filters"><input id="search" class="input" data-i18n-placeholder="ph_search"
                        placeholder="جستجوی متن..."><input id="regex" class="input mono" dir="ltr"
                        placeholder="ERROR|WARN"><select id="level" class="input">
                        <option value="all" data-i18n="all">همه</option>
                        <option value="error">ERROR</option>
                        <option value="warn">WARN</option>
                        <option value="info">INFO</option>
                        <option value="debug">DEBUG</option>
                        <option value="other" data-i18n="other">سایر</option>
                    </select><select id="group" class="input">
                        <option value="none" data-i18n="group_none">بدون گروه‌بندی</option>
                        <option value="level" data-i18n="group_level">سطح لاگ</option>
                        <option value="date" data-i18n="group_date">تاریخ</option>
                        <option value="source" data-i18n="group_source">منبع</option>
                    </select></div>
                <div class="actions"><button id="export" class="btn primary" data-i18n="button_2">خروجی
                        JSON</button><button id="save" class="btn" data-i18n="button_3">ذخیره تحلیل</button><button
                        id="load" class="btn" data-i18n="button_4">بارگذاری تحلیل</button><button id="copy" class="btn"
                        data-i18n="copy">کپی</button><button id="wrap" class="btn" data-i18n="wrap">شکستن خط</button>
                </div>
                <p id="status" role="status"></p>
            </section>
            <section class="la-stats">
                <div><b id="total">0</b><span data-i18n="total_lines">کل خطوط</span></div>
                <div><b id="errors">0</b><span>ERROR</span></div>
                <div><b id="warns">0</b><span>WARN</span></div>
                <div><b id="infos">0</b><span>INFO</span></div>
                <div><b id="debugs">0</b><span>DEBUG</span></div>
            </section>
            <section class="la-card">
                <h2 data-i18n="heading_2">محتوای لاگ</h2>
                <div id="log" class="log"></div>
            </section>
            <section id="saved" class="la-card" hidden>
                <h2 data-i18n="heading_3">تحلیل‌های ذخیره شده</h2>
                <div id="savedList"></div>
            </section>
        </section>
    </main>
    <div id="toast" role="status" hidden></div>
    <script src="assets/js/app.js"></script>
    <script src="../assets/tool-wrapper.js"></script>
</body>

</html>
