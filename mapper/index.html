<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="title">تبدیل واحد</title>
    <meta name="description" content="تبدیل سریع طول، وزن، دما و سرعت با ذخیرهٔ علاقه‌مندی‌ها">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <!-- Apply the saved theme before first paint (prevents a light/dark flash) -->
    <script>
        try {
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.dataset.theme = savedTheme;
        } catch (e) { }
    </script>

    <link rel="stylesheet" href="../Vazirmatn-font-face.css">
    <link rel="stylesheet" href="../assets/tools.css">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="../assets/tool-wrapper.css">
    <script src="assets/script.js" defer></script>
    <script src="../assets/tool-wrapper.js" defer></script>
</head>

<body>
    <main class="page page--narrow">
        <header class="page-header">
            <h2 class="page-title" data-i18n="heading_0">تبدیل واحد</h2>
            <p class="page-lead" data-i18n="text_subtitle_0">تبدیل سریع و آسان واحدها</p>
        </header>

        <div class="stack">
            <section class="card card--lg stack">
                <div class="tabs" role="tablist">
                    <button type="button" class="tab" role="tab" aria-selected="true" data-category="length"
                        data-i18n="button_0">طول</button>
                    <button type="button" class="tab" role="tab" aria-selected="false" tabindex="-1"
                        data-category="weight" data-i18n="button_1">وزن</button>
                    <button type="button" class="tab" role="tab" aria-selected="false" tabindex="-1"
                        data-category="temperature" data-i18n="button_2">دما</button>
                    <button type="button" class="tab" role="tab" aria-selected="false" tabindex="-1"
                        data-category="speed" data-i18n="button_3">سرعت</button>
                </div>

                <div class="converter">
                    <div>
                        <label class="label" for="inputValue" data-i18n="label_1">مقدار:</label>
                        <div class="conv-row">
                            <input class="field conv-value" id="inputValue" type="text" inputmode="decimal"
                                autocomplete="off" dir="ltr" placeholder="عدد را وارد کنید"
                                data-i18n-placeholder="placeholder_value">
                            <select class="field" id="fromUnit" aria-label="From unit"></select>
                        </div>
                    </div>

                    <div class="swap-row">
                        <button type="button" class="btn btn--secondary btn--icon swap-btn" id="swapBtn"
                            aria-label="Swap units" data-i18n-label="button_swap">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M7 4v14" />
                                <path d="m3 14 4 4 4-4" />
                                <path d="M17 20V6" />
                                <path d="m13 10 4-4 4 4" />
                            </svg>
                        </button>
                    </div>

                    <div>
                        <label class="label" for="outputValue" data-i18n="label_3">نتیجه:</label>
                        <div class="conv-row">
                            <div class="result-field">
                                <input class="field conv-value conv-result" id="outputValue" type="text" readonly
                                    dir="ltr" placeholder="نتیجه" data-i18n-placeholder="placeholder_result">
                                <button type="button" class="btn btn--ghost btn--icon copy-btn" id="copyBtn"
                                    aria-label="Copy result" data-i18n-label="button_copy">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                        <rect x="9" y="9" width="11" height="11" rx="2" />
                                        <path d="M5 15V6a2 2 0 0 1 2-2h9" />
                                    </svg>
                                </button>
                            </div>
                            <select class="field" id="toUnit" aria-label="To unit"></select>
                        </div>
                    </div>

                    <p class="alert alert--warning" id="resultHint" role="status" hidden></p>
                </div>

                <div class="row">
                    <button class="btn btn--primary" id="convertBtn" type="button" data-i18n="button_5">تبدیل</button>
                    <button class="btn btn--secondary" id="saveBtn" type="button" data-i18n="button_6">ذخیره در
                        علاقه‌مندی‌ها</button>
                </div>
            </section>

            <section class="card card--lg stack" aria-labelledby="favoritesTitle">
                <div class="favorites-head">
                    <h3 class="card-title" id="favoritesTitle" data-i18n="heading_1">علاقه‌مندی‌ها</h3>
                    <button class="btn btn--danger btn--sm" id="clearAllBtn" type="button" data-i18n="button_7"
                        hidden>پاک کردن همه</button>
                </div>
                <ul class="favorites-list" id="favoritesList"></ul>
                <p class="empty" id="emptyFavorites" data-i18n="text_empty_message_1">هیچ موردی در علاقه‌مندی‌ها وجود
                    ندارد</p>
            </section>
        </div>

        <footer class="page-footer">
            <p data-i18n="footer">جعبه ابزار</p>
        </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <dialog class="modal" id="confirmDialog" aria-labelledby="confirmTitle">
        <form method="dialog" class="modal-form">
            <div class="modal-header">
                <h2 class="modal-title" id="confirmTitle" data-dialog-title></h2>
            </div>
            <div class="modal-body">
                <p data-dialog-message></p>
            </div>
            <div class="modal-footer modal-footer--split">
                <button type="button" class="btn btn--ghost" data-dialog-cancel
                    data-i18n="dialog_cancel">انصراف</button>
                <button type="submit" class="btn btn--danger" value="ok" data-i18n="dialog_confirm">تأیید</button>
            </div>
        </form>
    </dialog>
</body>

</html>
