<!doctype html>
<html dir="rtl" lang="fa">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title data-i18n="title">Base64</title>
    <link rel="icon" href="/favicon.ico">
    <script>(function () { try { var t = (localStorage.getItem('theme') || '').replace(/"/g, ''); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t } catch (e) { } })()</script>
    <link rel="stylesheet" href="../Vazirmatn-font-face.css">
    <link rel="stylesheet" href="../assets/tools.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="../assets/tool-wrapper.css">
</head>

<body>
    <main class="en page">
        <header>
            <p class="eyebrow" data-i18n="eyebrow">تبدیل متن و تصویر به Base64 و بالعکس</p>
            <h1 data-i18n="heading_0">Base64 Encoder/Decoder</h1>
            <p class="muted" data-i18n="lead">Base64 رمزنگاری نیست؛ فقط تبدیل نمایش داده است. همه‌چیز روی دستگاه شما
                پردازش می‌شود.</p>
        </header>
        <section class="en-card">
            <h2 data-i18n="heading_1">متن</h2><label data-i18n="label_0">ورودی متن</label><textarea id="textIn"
                class="input" dir="auto"></textarea>
            <div class="actions"><button id="encode" class="btn primary" data-i18n="button_0">رمزنگاری</button><button
                    id="decode" class="btn" data-i18n="button_1">بازگشایی</button><button id="copyText" class="btn"
                    data-i18n="button_2">کپی خروجی</button></div><label data-i18n="label_1">خروجی</label><textarea
                id="textOut" class="input" dir="auto" readonly></textarea>
            <p id="textStatus" role="status"></p>
        </section>
        <section class="en-card">
            <h2 data-i18n="heading_2">تصویر</h2><input id="file" type="file"
                accept="image/jpeg,image/png,image/webp,image/gif">
            <div id="drop" class="drop" data-i18n="drop">تصویر را بکشید و رها کنید</div><img id="preview" hidden>
            <div class="actions"><button id="copyImg" class="btn" data-i18n="button_3">کپی Base64</button><button
                    id="clear" class="btn danger" data-i18n="button_4">پاک کردن</button></div><label
                data-i18n="label_3">خروجی تصویر</label><textarea id="imgOut" class="input" dir="ltr" spellcheck="false"
                placeholder="data:image/png;base64,..."></textarea>
            <p id="imgStatus" role="status"></p>
        </section>
    </main>
    <div id="toast" role="status" hidden></div>
    <script src="assets/js/encoder.js"></script>
    <script src="../assets/tool-wrapper.js"></script>
</body>

</html>
