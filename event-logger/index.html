<!doctype html><html dir="rtl" lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title data-i18n="title">مستندساز رویداد</title><link rel="icon" href="/favicon.ico"><script>(function(){try{var t=(localStorage.getItem('theme')||'').replace(/"/g,'');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}})()</script><link rel="stylesheet" href="../Vazirmatn-font-face.css"><link rel="stylesheet" href="../assets/tools.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="../assets/tool-wrapper.css"></head><body><main class="ev page"><header><h1 data-i18n="heading_0">مستندساز رویداد</h1><p class="muted" data-i18n="subtitle">ثبت رویدادها، تصویر و موقعیت؛ اطلاعات فقط روی دستگاه شما می‌مانند.</p></header><section class="ev-card"><h2 id="formtitle" data-i18n="heading_1">افزودن رویداد جدید</h2><form id="form"><label data-i18n="label_0">عنوان رویداد</label><input id="title" class="input" required maxlength="100"><label data-i18n="label_1">تاریخ و زمان</label><input id="date" class="input" type="datetime-local" required><label data-i18n="label_2">توضیحات</label><textarea id="desc" class="input" rows="3" maxlength="500"></textarea><label data-i18n="label_3">تصویر</label><input id="image" type="file" accept="image/*"><img id="preview" hidden><label data-i18n="label_4">موقعیت مکانی</label><input id="loc" class="input" maxlength="300"><button type="button" id="geo" class="btn" data-i18n="button_0">دریافت موقعیت فعلی</button><p id="coords"></p><div class="actions"><button class="btn primary" data-i18n="button_1">ذخیره رویداد</button><button type="button" id="reset" class="btn" data-i18n="button_2">پاک کردن فرم</button></div></form></section><section class="ev-card"><div class="filters"><input id="search" class="input" data-i18n-placeholder="ph_search"><select id="sort" class="input"><option value="date-desc" data-i18n="newest">جدیدترین</option><option value="date-asc" data-i18n="oldest">قدیمی‌ترین</option><option value="title" data-i18n="bytitle">براساس عنوان</option></select></div><div class="actions"><button id="export" class="btn primary" data-i18n="button_3">خروجی رمزشده</button><button id="import" class="btn" data-i18n="button_4">وارد کردن</button><input id="imp" type="file" accept=".json" hidden></div></section><section class="ev-card"><div class="row"><h2 data-i18n="heading_2">رویدادهای ثبت شده</h2><span id="count"></span></div><div id="list" class="list"></div></section></main><dialog id="password"><form method="dialog"><h2 id="ptitle"></h2><input id="pass" class="input" type="password" required><p id="pmsg"></p><div class="actions"><button value="ok" class="btn primary" data-i18n="confirm">تأیید</button><button value="cancel" class="btn" data-i18n="cancel">انصراف</button></div></form></dialog><dialog id="confirm"><form method="dialog"><p id="confirmtext"></p><div class="actions"><button value="yes" class="btn danger" data-i18n="yes">بله</button><button value="cancel" class="btn" data-i18n="cancel">انصراف</button></div></form></dialog><div id="toast" role="status" hidden></div><script src="assets/js/app.js"></script><script src="../assets/tool-wrapper.js"></script></body></html>
