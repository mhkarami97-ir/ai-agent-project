<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="مدیریت موجودی خانه با تاریخ انقضا و هشدار هوشمند">
<title data-i18n="title">مدیریت موجودی خانه</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<script>
(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<link rel="stylesheet" href="../Vazirmatn-font-face.css">
<link rel="stylesheet" href="../assets/tools.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="../assets/tool-wrapper.css">
</head>
<body>
<main class="page ht">
  <header class="ht-head">
    <h1 data-i18n="heading_0">مدیریت موجودی خانه</h1>
    <p class="muted" data-i18n="text_subtitle_0">مدیریت هوشمند مواد غذایی و لوازم خانه</p>
  </header>

  <div class="ht-alert" id="alertBanner" role="status" hidden>
    <span id="alertText"></span>
    <button type="button" class="ht-alert-close" id="alertClose" data-i18n-aria="aria_close" aria-label="بستن">×</button>
  </div>

  <section class="ht-stats" aria-label="آمار" data-i18n-aria="aria_stats">
    <div class="ht-stat"><strong id="statTotal">0</strong><span data-i18n="stat_total">کل اقلام</span></div>
    <div class="ht-stat ht-stat--ok"><strong id="statFresh">0</strong><span data-i18n="filter_fresh">تازه</span></div>
    <div class="ht-stat ht-stat--warn"><strong id="statExpiring">0</strong><span data-i18n="filter_expiring">در حال انقضا</span></div>
    <div class="ht-stat ht-stat--bad"><strong id="statExpired">0</strong><span data-i18n="filter_expired">منقضی شده</span></div>
  </section>

  <section class="ht-card" aria-labelledby="addTitle">
    <h2 id="addTitle" data-i18n="heading_add">افزودن قلم جدید</h2>
    <form id="itemForm" autocomplete="off">
      <div class="ht-grid">
        <div class="ht-field">
          <label for="itemName" data-i18n="label_name">نام قلم</label>
          <input id="itemName" type="text" required maxlength="80" data-i18n-placeholder="ph_name" placeholder="مثال: شیر، برنج، روغن">
        </div>
        <div class="ht-field">
          <label for="category" data-i18n="label_category">دسته‌بندی</label>
          <select id="category" required></select>
        </div>
        <div class="ht-field">
          <label for="quantity" data-i18n="label_quantity">تعداد/مقدار</label>
          <input id="quantity" type="text" required maxlength="40" data-i18n-placeholder="ph_quantity" placeholder="مثال: ۲ عدد، ۱ کیلو">
        </div>
        <div class="ht-field">
          <label for="expiryDate" data-i18n="label_expiry">تاریخ انقضا</label>
          <input id="expiryDate" type="date" required>
        </div>
        <div class="ht-field">
          <label for="location" data-i18n="label_location">محل قرارگیری</label>
          <select id="location"></select>
        </div>
        <div class="ht-field ht-field--wide">
          <label for="notes" data-i18n="label_notes">یادداشت</label>
          <textarea id="notes" rows="2" maxlength="300" data-i18n-placeholder="ph_notes" placeholder="یادداشت اختیاری..."></textarea>
        </div>
      </div>
      <div class="ht-actions">
        <button type="submit" class="ht-btn ht-btn--primary" data-i18n="btn_save">ذخیره</button>
        <button type="button" class="ht-btn" id="resetBtn" data-i18n="btn_reset">پاک کردن فرم</button>
      </div>
    </form>
  </section>

  <section class="ht-card" aria-labelledby="listTitle">
    <div class="ht-list-head">
      <h2 id="listTitle" data-i18n="heading_list">لیست اقلام</h2>
      <button type="button" class="ht-btn ht-btn--danger ht-btn--sm" id="clearAllBtn" data-i18n="btn_clear_all" hidden>حذف همه</button>
    </div>
    <div class="ht-tools">
      <input id="searchInput" type="search" enterkeyhint="search" data-i18n-placeholder="ph_search" placeholder="جستجو بر اساس نام...">
      <select id="sortBy" data-i18n-aria="aria_sort" aria-label="مرتب‌سازی">
        <option value="expiry-asc" data-i18n="sort_expiry_asc">نزدیک‌ترین انقضا</option>
        <option value="expiry-desc" data-i18n="sort_expiry_desc">دورترین انقضا</option>
        <option value="name-asc" data-i18n="sort_name_asc">نام (الف تا ی)</option>
        <option value="name-desc" data-i18n="sort_name_desc">نام (ی تا الف)</option>
        <option value="added-desc" data-i18n="sort_added_desc">جدیدترین</option>
      </select>
    </div>
    <div class="ht-filters" role="group" aria-label="فیلتر وضعیت" data-i18n-aria="aria_filter">
      <button type="button" class="ht-chip is-active" data-filter="all" aria-pressed="true" data-i18n="filter_all">همه</button>
      <button type="button" class="ht-chip" data-filter="fresh" aria-pressed="false" data-i18n="filter_fresh">تازه</button>
      <button type="button" class="ht-chip" data-filter="expiring" aria-pressed="false" data-i18n="filter_expiring">در حال انقضا</button>
      <button type="button" class="ht-chip" data-filter="expired" aria-pressed="false" data-i18n="filter_expired">منقضی شده</button>
    </div>
    <div class="ht-items" id="itemsList" aria-live="polite"></div>
  </section>
</main>

<dialog id="editDialog" class="ht-dialog" aria-labelledby="editTitle">
  <form id="editForm" method="dialog">
    <h2 id="editTitle" data-i18n="heading_edit">ویرایش قلم</h2>
    <input id="editId" type="hidden">
    <div class="ht-grid">
      <div class="ht-field">
        <label for="editName" data-i18n="label_name">نام قلم</label>
        <input id="editName" type="text" required maxlength="80">
      </div>
      <div class="ht-field">
        <label for="editCategory" data-i18n="label_category">دسته‌بندی</label>
        <select id="editCategory" required></select>
      </div>
      <div class="ht-field">
        <label for="editQuantity" data-i18n="label_quantity">تعداد/مقدار</label>
        <input id="editQuantity" type="text" required maxlength="40">
      </div>
      <div class="ht-field">
        <label for="editExpiry" data-i18n="label_expiry">تاریخ انقضا</label>
        <input id="editExpiry" type="date" required>
      </div>
      <div class="ht-field">
        <label for="editLocation" data-i18n="label_location">محل قرارگیری</label>
        <select id="editLocation"></select>
      </div>
      <div class="ht-field ht-field--wide">
        <label for="editNotes" data-i18n="label_notes">یادداشت</label>
        <textarea id="editNotes" rows="2" maxlength="300"></textarea>
      </div>
    </div>
    <div class="ht-actions">
      <button type="submit" class="ht-btn ht-btn--primary" data-i18n="btn_save_changes">ذخیره تغییرات</button>
      <button type="button" class="ht-btn" id="editCancel" data-i18n="btn_cancel">انصراف</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDialog" class="ht-dialog ht-dialog--sm" aria-labelledby="confirmText">
  <form method="dialog">
    <p id="confirmText"></p>
    <div class="ht-actions">
      <button type="submit" value="ok" class="ht-btn ht-btn--danger" data-i18n="btn_confirm">بله، حذف شود</button>
      <button type="submit" value="cancel" class="ht-btn" data-i18n="btn_cancel">انصراف</button>
    </div>
  </form>
</dialog>

<div class="ht-toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/script.js"></script>
<script src="../assets/tool-wrapper.js"></script>
</body>
</html>
