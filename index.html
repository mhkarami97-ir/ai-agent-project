<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <title>Web Tools</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#7c5cff" />
    <meta name="description" content="مجموعه ابزارهای آنلاین کاربردی - Web Tools Collection" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Web Tools" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/assets/contact-form.css">
</head>

<body>
    <div id="updateNotification" class="update-notification hidden" role="alert" aria-live="polite">
        <div class="update-content">
            <div class="update-icon-wrap" aria-hidden="true">
                <svg class="update-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                    <path d="M16 21h5v-5"/>
                </svg>
                <span class="update-pulse-dot"></span>
            </div>
            <div class="update-text">
                <div class="update-title-row">
                    <strong class="update-title">نسخه جدید در دسترس است</strong>
                    <span class="update-badge">PWA</span>
                </div>
                <p class="update-desc">برای دریافت آخرین تغییرات و بهبودها، برنامه را به‌روزرسانی کنید.</p>
            </div>
            <div class="update-actions">
                <button id="updateButton" class="update-button" type="button">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2v6h-6"/>
                        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                        <path d="M3 22v-6h6"/>
                        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                    </svg>
                    <span>به‌روزرسانی</span>
                </button>
                <button id="dismissUpdate" class="dismiss-button" type="button" title="بستن" aria-label="بستن اعلان">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="wrap">
        <header>
            <div class="header-content">
                <h1>ابزارهای کاربردی</h1>
            </div>
            <div class="header-actions">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="جستجوی ابزار..." />
                </div>
                <button class="header-contact-btn" id="openContactBtn" title="تماس با ما / گزارش مشکل"
                    aria-label="Contact us">
                    <span>📧</span>
                </button>
                <button class="theme-toggle" id="themeToggle" title="تغییر تم" aria-label="Toggle theme">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </header>

        <section class="card" aria-label="Tools list">
            <div class="stats-bar">
                <span>تعداد ابزارها: <span class="count" id="totalCount">0</span></span>
                <span id="filteredInfo"></span>
            </div>
            <div class="list-area">
                <nav id="tabs" class="tabs" role="tablist" aria-label="دسته‌بندی"></nav>
                <ul id="toolsList">
                </ul>
                <div id="noResults" class="no-results hidden">
                    <div class="no-results-icon">
                        🔍
                    </div>
                    <p>هیچ ابزاری یافت نشد</p>
                    <p style="font-size: 13px;">لطفاً کلمات دیگری را امتحان کنید</p>
                </div>
            </div>
        </section>

        <footer>
            <span>طراحی توسط <a href="https://mhkarami97.ir">محمد حسین کرمی</a> </span>
            <span><a href="https://mhkarami97.ir">mhkarami97.ir</a></span>
        </footer>
    </div>

    <script src="script.js"></script>
    <script src="app-updater.js"></script>
    <script src="/assets/contact-form.js"></script>
</body>

</html>
